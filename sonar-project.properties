# SonarQube Cloud analysis (US region), run from the pipeline rather than by automatic
# analysis, so the coverage report the tests produce is imported and
# the scan runs on the same commit the other gates judged.
sonar.projectKey=tltaylor1_role-call
sonar.organization=tltaylor1
sonar.projectName=role-call
sonar.sources=rolecall,frontend
sonar.tests=tests
sonar.exclusions=rolecall/templates/**,frontend/app.css
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
