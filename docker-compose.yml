# Local development stack. Both images are digest-pinned. No credential
# lives in this file: the database password comes from .env, which git
# ignores; .env.example documents the shape.
services:
  db:
    image: postgres@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_USER: rolecall
      POSTGRES_DB: rolecall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env, see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolecall -d rolecall"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      # Loopback only: migration authoring runs Alembic from the host.
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      ROLECALL_DATABASE_URL: postgresql+psycopg://rolecall:${POSTGRES_PASSWORD:?set it in .env, see .env.example}@db:5432/rolecall
      ROLECALL_ADMIN_USERNAME: ${ROLECALL_ADMIN_USERNAME:-}
      ROLECALL_ADMIN_PASSWORD: ${ROLECALL_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
