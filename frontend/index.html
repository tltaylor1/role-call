<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>role-call</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- The shell is public and carries no data. Every value on this
       page arrives over the authenticated API and is rendered through
       textContent, never through markup: imported files control names,
       tags, and policy text, and this page treats all of it as text. -->
  <header>
    <h1>role-call</h1>
    <p id="asof" class="asof" hidden></p>
    <nav id="nav" hidden>
      <button data-view="inventory">Inventory</button>
      <button data-view="groups">Groups</button>
      <button data-view="imports">Imports</button>
      <span class="spacer"></span>
      <span id="whoami"></span>
      <button id="signout">Sign out</button>
    </nav>
  </header>

  <main>
    <section id="signin">
      <h2>Sign in</h2>
      <form id="signin-form">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
        <p id="signin-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section id="inventory" hidden>
      <div id="dashboard" class="tiles"></div>
      <div class="filters">
        <input id="filter-text" placeholder="filter by name">
        <select id="filter-type">
          <option value="">every type</option>
          <option value="user">users</option>
          <option value="role">roles</option>
          <option value="root">root</option>
        </select>
        <select id="filter-tier">
          <option value="">every tier</option>
          <option value="critical">critical</option>
          <option value="warning">warning</option>
          <option value="notice">notice</option>
          <option value="quiet">quiet</option>
        </select>
      </div>
      <table>
        <thead><tr>
          <th>identity</th><th>type</th><th>account</th>
          <th>critical</th><th>warning</th><th>notice</th><th>flags</th>
        </tr></thead>
        <tbody id="identity-rows"></tbody>
      </table>
    </section>

    <section id="detail" hidden>
      <button id="back">Back to inventory</button>
      <h2 id="detail-name"></h2>
      <dl id="detail-facts"></dl>
      <h3>Findings</h3>
      <ul id="detail-findings"></ul>
      <h3>Privilege sources</h3>
      <ul id="detail-sources"></ul>
      <h3>Observations</h3>
      <table>
        <thead><tr><th>captured</th><th>source</th><th>fields</th></tr></thead>
        <tbody id="detail-timeline"></tbody>
      </table>
    </section>

    <section id="groups" hidden>
      <h2>Groups</h2>
      <table>
        <thead><tr>
          <th>group</th><th>account</th><th>members</th>
          <th>privileged</th><th>findings</th>
        </tr></thead>
        <tbody id="group-rows"></tbody>
      </table>
    </section>

    <section id="imports" hidden>
      <h2>Imports</h2>
      <form id="import-form">
        <label>File <input name="file" type="file" required></label>
        <label>Kind
          <select name="kind">
            <option value="credential-report">credential report</option>
            <option value="authorization-details">authorization details</option>
          </select>
        </label>
        <label>Captured at <input name="captured_at" placeholder="2026-08-01T00:00:00+00:00" required></label>
        <button type="submit">Import</button>
        <p id="import-result" role="status" hidden></p>
      </form>
      <table>
        <thead><tr>
          <th>account</th><th>source</th><th>captured</th>
          <th>imported</th><th>rows</th><th>skipped</th>
        </tr></thead>
        <tbody id="import-rows"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
