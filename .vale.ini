# Vale configuration. The writing rules live in .vale/styles/BuildGuidelines and
# are enforced as a pre-commit hook and in continuous integration.
StylesPath = .vale/styles

MinAlertLevel = error

[*.md]
BasedOnStyles = BuildGuidelines
Proselint.Cliches = error
Proselint.CorporateSpeak = error

# Comments in the scripts are prose too, and were the one place the rules went
# unchecked. The rule definitions under .vale are excluded, because a rule file
# necessarily contains the words it bans.
[scripts/*.sh]
BasedOnStyles = BuildGuidelines
