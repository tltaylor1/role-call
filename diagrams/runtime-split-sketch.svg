<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="what docker provides and what kubernetes adds, working sketch">
  <!-- Working sketch under the diagram doctrine. Self-contained: system fonts, no external references. -->
  <rect width="920" height="470" fill="#f6f5f2"/>

  <text x="40" y="36" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" letter-spacing="1.5" fill="#57606a">ONE IMAGE, TWO RUNTIMES, WORKING SKETCH</text>

  <!-- the shared image, the one thing both lanes consume -->
  <rect x="360" y="56" width="200" height="58" rx="6" fill="rgba(176,79,46,0.06)" stroke="#b04f2e"/>
  <text x="460" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">The image</text>
  <text x="460" y="96" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">digest-pinned base, hash-pinned tree, non-root</text>

  <line x1="420" y1="114" x2="260" y2="150" stroke="#57606a" stroke-width="1.5"/>
  <line x1="500" y1="114" x2="660" y2="150" stroke="#57606a" stroke-width="1.5"/>

  <!-- compose lane -->
  <rect x="60" y="150" width="380" height="270" rx="8" fill="none" stroke="#8a939e" stroke-dasharray="4 4"/>
  <text x="80" y="174" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" letter-spacing="1.2" fill="#57606a">DOCKER COMPOSE PROVIDES</text>

  <text x="80" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">Two hardened containers</text>
  <text x="80" y="216" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">read-only roots, dropped capabilities, caps on memory</text>

  <text x="80" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">One private network</text>
  <text x="80" y="260" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">the database publishes no host port</text>

  <text x="80" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">Loopback publishing</text>
  <text x="80" y="304" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">127.0.0.1:8000 and nothing nonlocal</text>

  <text x="80" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">Restart and healthcheck</text>
  <text x="80" y="348" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">per container, no scheduler behind it</text>

  <text x="80" y="392" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#b04f2e">what it cannot do: admission, network policy, identity</text>
  <text x="80" y="405" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#b04f2e">rules are per-file flags, not refusals at a gate</text>

  <!-- kubernetes lane -->
  <rect x="480" y="150" width="380" height="270" rx="8" fill="none" stroke="#8a939e" stroke-dasharray="4 4"/>
  <text x="500" y="174" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" letter-spacing="1.2" fill="#57606a">KUBERNETES ADDS</text>

  <text x="500" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">Admission at the gate</text>
  <text x="500" y="216" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">restricted pod security, digest-pinned images refused otherwise</text>

  <text x="500" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">Network policy, enforced</text>
  <text x="500" y="260" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">default deny; three named flows; Calico makes it real</text>

  <text x="500" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">Workload identity, minimized</text>
  <text x="500" y="304" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">service accounts with no permissions and no mounted token</text>

  <text x="500" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#24292e">Desired state and probes</text>
  <text x="500" y="348" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">liveness, readiness on the database round trip, reschedule</text>

  <text x="500" y="392" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#b04f2e">the difference in one line: compose trusts the files,</text>
  <text x="500" y="405" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#b04f2e">kubernetes refuses at a gate what the files forgot</text>

  <text x="40" y="450" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">both lanes run the same digest-built image and the same database digest; neither rebuilds for the other</text>
</svg>
