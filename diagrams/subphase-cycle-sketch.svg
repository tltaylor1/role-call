<svg viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="the subphase review cycle working sketch">
  <!-- Working sketch under the diagram doctrine. Self-contained: system fonts, no external references.
       Twelve subphases in a row would be a list wearing boxes, and a list beats
       that diagram; the drawing that earns its place is the cycle each subphase travels. -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="880" height="460" fill="#f6f5f2"/>
  <text x="40" y="36" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" letter-spacing="1.5" fill="#57606a">THE SUBPHASE CYCLE, WORKING SKETCH</text>
  <text x="40" y="56" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">every subphase, 1.1 through 1.12, travels this loop; nothing skips the gate</text>

  <!-- stations -->
  <rect x="320" y="60" width="240" height="58" rx="6" fill="#ffffff" stroke="#24292e"/>
  <text x="440" y="84" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Plan fixed in advance</text>
  <text x="440" y="100" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">scope set before any code</text>

  <rect x="600" y="170" width="240" height="58" rx="6" fill="#ffffff" stroke="#24292e"/>
  <text x="720" y="194" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Built in small commits</text>
  <text x="720" y="210" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">local only, gates on every commit</text>

  <rect x="460" y="330" width="240" height="58" rx="6" fill="#ffffff" stroke="#24292e"/>
  <text x="580" y="354" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Runnable demo and tests</text>
  <text x="580" y="370" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">controls arrive with their tests</text>

  <!-- the gate, focal -->
  <rect x="180" y="330" width="240" height="58" rx="6" fill="rgba(176,79,46,0.06)" stroke="#b04f2e"/>
  <text x="300" y="354" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Human review</text>
  <text x="300" y="370" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">diff, demo, tests; the gate</text>

  <rect x="40" y="170" width="240" height="58" rx="6" fill="#ffffff" stroke="#24292e"/>
  <text x="160" y="194" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#24292e">Push to the public repo</text>
  <text x="160" y="210" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="9" fill="#57606a">the review's receipt</text>

  <!-- the loop -->
  <path d="M560,89 H712 Q720,89 720,97 V164" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720,228 V351 Q720,359 712,359 H706" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M460,359 H426" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M180,359 H168 Q160,359 160,351 V234" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="300" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">approved</text>
  <path d="M160,170 V97 Q160,89 168,89 H314" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="186" y="81" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="8" fill="#57606a">next subphase</text>
</svg>
