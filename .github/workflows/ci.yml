# Continuous integration gates. Third-party actions are pinned by full
# commit hash, and tools are downloaded directly from their canonical
# releases and checksum-verified before they run, so the pipeline's own
# supply chain meets the same bar as the application's.
name: checks

# The pipeline's own identity holds least privilege: read-only contents.
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The token does not outlive the checkout; no later step needs it.
          persist-credentials: false
      - name: install trufflehog, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o th.tar.gz https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz
          echo "62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4  th.tar.gz" | sha256sum -c -
          tar -xzf th.tar.gz trufflehog
      - name: scan the full history with verification on
        run: '"$RUNNER_TEMP/trufflehog" git file://. --fail'

  writing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install vale, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.17.0/vale_3.17.0_Linux_64-bit.tar.gz
          echo "a903f1f60c3293fac643e0137f599a462881cc691ee19d6120dcfc786f1be86d  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
      - name: writing rules
        run: git ls-files -z "*.md" | xargs -0 "$RUNNER_TEMP/vale"
      - name: forbid deferred-work markers
        run: |
          ! grep -rnE "\b(TODO|FIXME|HACK|XXX)\b" --exclude-dir=.git --exclude-dir=.github --exclude-dir=.venv --exclude=AGENTS.md --exclude=.pre-commit-config.yaml .

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install actionlint, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o al.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tar.gz" | sha256sum -c -
          tar -xzf al.tar.gz actionlint
      - name: lint the workflows
        run: '"$RUNNER_TEMP/actionlint"'
      # zizmor publishes no checksum file; this hash was computed from
      # the artifact inspected at adoption and pins exactly that artifact.
      - name: install zizmor, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o zz.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  zz.tar.gz" | sha256sum -c -
          tar -xzf zz.tar.gz
      - name: audit the workflows
        run: '"$(find "$RUNNER_TEMP" -name zizmor -type f)" --no-online-audits --no-progress .github/workflows/'

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install lychee, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o ly.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  ly.tar.gz" | sha256sum -c -
          tar -xzf ly.tar.gz
      # Offline on purpose: the pipeline checks the cross-references
      # inside this repository and fetches nothing.
      - name: check internal links
        run: git ls-files -z "*.md" | xargs -0 "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" --offline --no-progress --include-fragments

  application:
    runs-on: ubuntu-latest
    # The same digest the Dockerfile pins, so the interpreter that tests
    # the code is the interpreter that ships it.
    container:
      image: python@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned tree, hashes enforced
        run: |
          pip install --no-cache-dir --require-hashes -r requirements.txt
          pip install --no-cache-dir --require-hashes -r requirements-dev.txt
      - name: lint
        run: ruff check .
      - name: tests
        run: pytest
      - name: audit the pinned tree against known vulnerabilities
        run: pip-audit --require-hashes -r requirements.txt
      - name: software bill of materials
        run: pip-audit --require-hashes -r requirements.txt --format cyclonedx-json --output "$RUNNER_TEMP/sbom.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.json
