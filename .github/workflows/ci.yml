# Continuous integration gates. Third-party actions are pinned by full
# commit hash, and tools are downloaded directly from their canonical
# releases and checksum-verified before they run, so the pipeline's own
# supply chain meets the same bar as the application's.
name: checks

# The pipeline's own identity holds least privilege: read-only contents.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # The weekly run exists for the scanners whose subject changes while
  # the code does not: a critical fix shipping for the base image, or a
  # new advisory against a pinned dependency, gets found on a clock
  # instead of waiting for the next pull request to take the blame.
  schedule:
    - cron: "37 9 * * 2"

# A branch push and its pull request used to run this twice, which
# doubled the exposure to a network blip on a tool download and taught
# nothing extra. Branches are gated by their pull request; main is
# gated on the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The token does not outlive the checkout; no later step needs it.
          persist-credentials: false
      - name: install trufflehog, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o th.tar.gz https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz
          echo "62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4  th.tar.gz" | sha256sum -c -
          tar -xzf th.tar.gz trufflehog
      - name: scan the full history with verification on
        run: '"$RUNNER_TEMP/trufflehog" git file://. --fail'

  writing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit-message check walks every commit on the pull
          # request, which a shallow clone cannot.
          fetch-depth: 0
      - name: install vale, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.17.0/vale_3.17.0_Linux_64-bit.tar.gz
          echo "a903f1f60c3293fac643e0137f599a462881cc691ee19d6120dcfc786f1be86d  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
      - name: writing rules
        run: git ls-files -z "*.md" | xargs -0 "$RUNNER_TEMP/vale"
      - name: docs-truth status check
        run: python3 scripts/check_docs_truth.py
      - name: digest-parity check
        run: python3 scripts/check_digest_parity.py
      - name: actions inventory check
        run: python3 scripts/check_actions_inventory.py
      - name: commit messages follow the writing rules
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=100 origin "$BASE_REF"
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-message"
            bash scripts/check_commit_message.sh "$RUNNER_TEMP/commit-message"
          done
      - name: forbid deferred-work markers
        run: |
          ! grep -rnE "\b(TODO|FIXME|HACK|XXX)\b" --exclude-dir=.git --exclude-dir=.github --exclude-dir=.venv --exclude-dir=.tools --exclude=AGENTS.md --exclude=.pre-commit-config.yaml --exclude="calico-v*.yaml" .

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install actionlint, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o al.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tar.gz" | sha256sum -c -
          tar -xzf al.tar.gz actionlint
      - name: lint the workflows
        run: '"$RUNNER_TEMP/actionlint"'
      # zizmor publishes no checksum file; this hash was computed from
      # the artifact inspected at adoption and pins exactly that artifact.
      - name: install zizmor, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o zz.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  zz.tar.gz" | sha256sum -c -
          tar -xzf zz.tar.gz
      - name: audit the workflows
        run: '"$(find "$RUNNER_TEMP" -name zizmor -type f)" --no-online-audits --no-progress .github/workflows/'

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install lychee, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o ly.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  ly.tar.gz" | sha256sum -c -
          tar -xzf ly.tar.gz
      # Offline on purpose: the pipeline checks the cross-references
      # inside this repository and fetches nothing.
      - name: check internal links
        run: git ls-files -z "*.md" | xargs -0 "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" --offline --no-progress --include-fragments

  floor:
    # The stated Python floor, held by execution: the whole suite on
    # the oldest supported interpreter, because the shipped image runs
    # 3.14 and 3.14 alone forgives what older interpreters refuse
    # (D-053). The pin is a tag on purpose: the floor is a version
    # claim, not an artifact claim.
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned tree, hashes enforced
        run: |
          pip install --no-cache-dir --require-hashes -r requirements.txt
          pip install --no-cache-dir --require-hashes -r requirements-dev.txt
      - name: the suite on the floor interpreter
        run: pytest -q

  application:
    runs-on: ubuntu-latest
    # The same digest the Dockerfile pins, so the interpreter that tests
    # the code is the interpreter that ships it. Automated update tools
    # only bump the Dockerfile; this pin moves by hand in the same commit.
    container:
      image: python@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
    services:
      # A real database for the migration drift check, on the same digest
      # the compose file pins. The password derives from the run id: not
      # a secret, not credential-shaped, different every run.
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: rolecall
          POSTGRES_DB: rolecall
          POSTGRES_PASSWORD: ci-run-${{ github.run_id }}
        options: >-
          --health-cmd "pg_isready -U rolecall -d rolecall"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned tree, hashes enforced
        run: |
          pip install --no-cache-dir --require-hashes -r requirements.txt
          pip install --no-cache-dir --require-hashes -r requirements-dev.txt
      - name: lint
        run: ruff check .
      - name: types
        run: mypy
      - name: tests, with the coverage floor
        # The floor sits under the measured figure (94 at adoption) so
        # it catches erosion without inviting tests written to move a
        # number (D-041).
        run: pytest --cov=rolecall --cov-fail-under=90
      - name: mutation check
        # Break one control at a time; the tests that claim it must
        # fail. Seven reviewed mutations, minutes not hours (D-041).
        run: python3 scripts/check_mutation.py
      - name: migrations apply and match the models
        env:
          ROLECALL_DATABASE_URL: postgresql+psycopg://rolecall:ci-run-${{ github.run_id }}@postgres:5432/rolecall
        run: |
          alembic upgrade head
          alembic check
      - name: the runtime role cannot touch schema (D-013)
        env:
          ROLECALL_OWNER_DATABASE_URL: postgresql+psycopg://rolecall:ci-run-${{ github.run_id }}@postgres:5432/rolecall
        run: |
          export ROLECALL_APP_DB_PASSWORD="probe-${{ github.run_id }}"
          python scripts/setup_db_roles.py
          python - << 'PROBE'
          import os, psycopg
          url = f"postgresql://rolecall_app:{os.environ['ROLECALL_APP_DB_PASSWORD']}@postgres:5432/rolecall"
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute("select count(*) from identities")
                  print("data read: allowed")
                  try:
                      cur.execute("create table probe_should_fail (id int)")
                      raise SystemExit("REFUSAL MISSING: runtime role created a table")
                  except psycopg.errors.InsufficientPrivilege:
                      print("schema change: refused, as decided")
          PROBE
      - name: audit the pinned trees against known vulnerabilities
        run: |
          pip-audit --require-hashes -r requirements.txt
          pip-audit --require-hashes -r requirements-dev.txt
      - name: software bill of materials
        run: pip-audit --require-hashes -r requirements.txt --format cyclonedx-json --output "$RUNNER_TEMP/sbom.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install hadolint, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  hadolint" | sha256sum -c -
          chmod +x hadolint
      - name: lint the container file
        run: '"$RUNNER_TEMP/hadolint" Dockerfile'
      - name: install trivy, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: base image operating system packages, blocking on critical with a fix
        # The digest in the Dockerfile is what gets scanned, so the
        # scan and the build cannot disagree about the base. Blocking
        # only where a digest move is the fix, per the alarm-stays-
        # meaningful rule (D-037, D-041): unfixed Debian findings are
        # reported, not failed on.
        run: |
          BASE=$(grep -oP '^FROM \K.*' Dockerfile)
          "$RUNNER_TEMP/trivy" image --scanners vuln --pkg-types os --ignore-unfixed --severity CRITICAL --exit-code 1 "$BASE"
      - name: base image, the rest reported for the record
        run: |
          BASE=$(grep -oP '^FROM \K.*' Dockerfile)
          "$RUNNER_TEMP/trivy" image --scanners vuln --pkg-types os --severity HIGH,CRITICAL "$BASE" || true
      - name: scan the pinned trees for malware shapes
        # pip-audit knows published vulnerabilities; GuardDog's
        # heuristics see what has no advisory yet: install-time
        # execution, exfiltration shapes, typosquats (D-052). It runs
        # in this job because the application job lives inside the
        # pinned Python container, which has no docker client; this
        # job runs on the runner, where the official image can run
        # digest-pinned. The digest is watched by the digest-parity
        # check.
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/datadog/guarddog@sha256:3dbc783f65f508b95222101cb2cd84d1d5f3e3675e42d6f1329bb9b8a99c8998 pypi verify /repo/requirements.txt
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/datadog/guarddog@sha256:3dbc783f65f508b95222101cb2cd84d1d5f3e3675e42d6f1329bb9b8a99c8998 pypi verify /repo/requirements-dev.txt
      - name: install kubeconform and kube-linter, verified
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          curl -sSfL --retry 3 --retry-delay 2 --retry-connrefused -o kube-linter.tar.gz https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz
          echo "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df  kube-linter.tar.gz" | sha256sum -c -
          tar -xzf kube-linter.tar.gz kube-linter
      - name: manifests match their schemas
        # The admission policy kinds are skipped because the schema
        # registry lags the API; the cluster itself validated them.
        run: '"$RUNNER_TEMP/kubeconform" -summary -skip ValidatingAdmissionPolicy,ValidatingAdmissionPolicyBinding deploy/k8s/'
      - name: manifest posture lint
        run: '"$RUNNER_TEMP/kube-linter" lint deploy/k8s/'
